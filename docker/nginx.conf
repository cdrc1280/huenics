# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Allow Let's Encrypt ACME challenges through
    location /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    # Health check endpoint — must work over HTTP for load balancers
    location /up {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Redirect all other HTTP traffic to HTTPS if behind reverse proxy
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}

# ─── Main Application Server ──────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # Request limits — 50M to accommodate scanned high-res quotation PDFs / images
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 75s;
    send_timeout 60s;

    sendfile on;
    tcp_nopush on;
    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-Frame-Options           "SAMEORIGIN"                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header X-DNS-Prefetch-Control    "off"                             always;

    # Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /livewire {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM processing
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 180;

        fastcgi_hide_header X-Powered-By;
    }

    # Static assets cache
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Deny dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }

    # Deny config and sensitive extensions
    location ~* \.(sh|bash|sql|log|env|lock|json|md|yaml|yml|xml|ini|config)$ {
        deny all;
        return 404;
    }
}