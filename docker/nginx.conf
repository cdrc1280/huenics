# ─── Main Application Server ──────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # Request limits — 50M to accommodate scanned high-res quotation PDFs / images
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 75s;
    send_timeout 60s;

    sendfile on;
    tcp_nopush on;
    server_tokens off;

    # Determine forwarded protocol & HTTPS status behind cloud load balancers / proxies
    set $forwarded_proto $scheme;
    if ($http_x_forwarded_proto != '') {
        set $forwarded_proto $http_x_forwarded_proto;
    }

    set $https_forwarded off;
    if ($forwarded_proto = 'https') {
        set $https_forwarded on;
    }
    if ($https = 'on') {
        set $https_forwarded on;
    }

    # Security headers
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-Frame-Options           "SAMEORIGIN"                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header X-DNS-Prefetch-Control    "off"                             always;

    # Health check endpoint for Cloud PaaS (Railway / Render / AWS)
    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # Allow ACME challenges through for SSL certs
    location /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    # Main routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Livewire endpoint & asset routing
    location ^~ /livewire/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM processing
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTPS $https_forwarded;
        fastcgi_read_timeout 180;

        fastcgi_hide_header X-Powered-By;
    }

    # Static assets with fallback to Laravel for dynamically generated assets (Livewire/Filament scripts)
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot|otf)$ {
        try_files $uri /index.php?$query_string;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Deny dotfiles except .well-known
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # Deny config and sensitive extensions
    location ~* \.(sh|bash|sql|log|env|lock|json|md|yaml|yml|xml|ini|config)$ {
        deny all;
        return 404;
    }
}