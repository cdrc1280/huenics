name: huenics

# ═══════════════════════════════════════════════════════════════════════════════
# DATA PERSISTENCE STRATEGY
# ═══════════════════════════════════════════════════════════════════════════════
# Every deployment rebuilds the app image — but persistent data lives in
# named Docker volumes that SURVIVE rebuilds and container restarts:
#
#   db_data      → MySQL database (all transactions, quotations, POs, DRs, etc.)
#   app_storage  → Uploaded documents (PDFs, images, e-signatures, attachments)
#   app_logs     → Laravel application logs (for debugging production issues)
#   redis_data   → Redis cache & queue jobs
#
# NEVER run: docker-compose down -v   ← this deletes volumes and ALL data!
# SAFE to run: docker-compose up -d --build  ← rebuilds image, keeps volumes
# ═══════════════════════════════════════════════════════════════════════════════

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: production
    container_name: huenics_app
    restart: always
    ports:
      - "8000:80"
    environment:
      APP_NAME: "Huenics"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: huenics
      DB_USERNAME: huenics_user
      DB_PASSWORD: huenics_password
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: database
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      # Uploaded documents, PDFs, scanned invoices, media
      - app_storage:/var/www/html/storage/app
      # Application logs persisted for debugging
      - app_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: huenics_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: huenics_root_password
      MYSQL_DATABASE: huenics
      MYSQL_USER: huenics_user
      MYSQL_PASSWORD: huenics_password
    volumes:
      # Master database volume
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: huenics_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:      # MySQL — all transactional data
  app_storage:  # Uploaded files — document PDFs, images, attachments
  app_logs:     # Laravel logs — for post-deploy debugging
  redis_data:   # Redis — cache and queue data