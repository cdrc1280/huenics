name: huenics

# ═══════════════════════════════════════════════════════════════════════════════
# DATA PERSISTENCE & PRODUCTION SAFETY GUARANTEE
# ═══════════════════════════════════════════════════════════════════════════════
# Named Docker volumes ensure that all transactional data, uploads, and logs
# remain 100% persistent across container updates, rebuilds, and deployments:
#
#   db_data      → MySQL master data (all users, quotations, POs, DRs, transactions)
#   app_storage  → Uploaded documents (PDFs, scanned invoices, media, signatures)
#   app_logs     → Laravel application logs
#   redis_data   → Redis cache & job queues
#
# SAFE TO RUN:    docker compose up -d --build (rebuilds app code, preserves data)
# NEVER RUN:      docker compose down -v       (would delete volumes)
# ═══════════════════════════════════════════════════════════════════════════════

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: production
    container_name: huenics_app
    restart: always
    stop_grace_period: 30s
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_NAME: "Huenics"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: "${APP_KEY:-}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-huenics}
      DB_USERNAME: ${DB_USERNAME:-huenics_user}
      DB_PASSWORD: ${DB_PASSWORD:-huenics_password}
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      QUEUE_CONNECTION: database
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      REDIS_PREFIX: "${REDIS_PREFIX:-huenics_database_}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-}"
      SESSION_SAME_SITE: "${SESSION_SAME_SITE:-lax}"
      SESSION_LIFETIME: 480
      SESSION_ENCRYPT: "${SESSION_ENCRYPT:-false}"
    volumes:
      # Uploaded documents, PDFs, scanned invoices, signatures, attachments
      - app_storage:/var/www/html/storage/app
      # Application logs persisted for monitoring
      - app_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: huenics_db
    restart: always
    stop_grace_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-huenics_root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-huenics}
      MYSQL_USER: ${DB_USERNAME:-huenics_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-huenics_password}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --max-connections=150
    volumes:
      # Master database volume — 100% persistent
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: huenics_redis
    restart: always
    stop_grace_period: 15s
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:      # MySQL persistent database files
  app_storage:  # Uploaded documents, PDFs, attachments
  app_logs:     # Application logs
  redis_data:   # Redis persistent storage